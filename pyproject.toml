[project]
name = "skills-sample-blog"
version = "0.1.0"
description = "A small Flask + SQLite blog that shows what goes in CLAUDE.md and what goes in a Claude Code Skill."
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "markdown>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["blog"]

[tool.setuptools.package-data]
blog = ["templates/*.html"]
